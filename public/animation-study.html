<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江小豚 · 动作检查</title><link rel="stylesheet" href="/animation-study.css"><script type="module" src="/animation-study.mjs?v=5"></script></head><body>
<main><h1>江小豚 · 动作检查</h1><p>与首页共用角色、姿势和渲染器，用于检查连接、握持和动作节奏。</p>
<div class="controls"><label>动作<select id="action"><option value="normal">各场景日常动作</option><option value="wave">挥手</option><option value="welcome">欢迎</option><option value="sleepy">揉眼与休息</option><option value="bored">托腮</option></select></label><button id="play" type="button">暂停</button><button id="restart" type="button">重新播放</button><label>速度<select id="speed"><option value="1">正常</option><option value="0.25">四分之一</option></select></label><label>时间<input type="range" id="time" min="0" max="48" step="0.0166667" value="0"></label><output id="readout">0.00 s</output></div>
<label>定位到秒 <input id="seek" type="number" min="0" max="48" step="0.1" value="0"></label>
<section class="fronts"><article><h2>认识武汉</h2><div id="reception"></div></article><article><h2>规划旅行</h2><div id="travel"></div></article><article><h2>SPU 社区</h2><div id="community"></div></article></section>
<section class="arena"><h2>SAIG · 两方保持对视</h2><div class="commanders"><div id="blue"></div><span>VS</span><div id="red"></div></div></section></main></body></html>
